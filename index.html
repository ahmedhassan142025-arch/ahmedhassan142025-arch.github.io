<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b2d8e"><link rel="manifest" href="2-manifest.json"><link rel="icon" href="4-icon-192.png"><link rel="apple-touch-icon" href="4-icon-192.png"><title>أرابيا جروب</title>
<style>:root{--p:#7b2d8e;--p2:#e2548c;--bg:#faf6fb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:var(--bg);color:#222}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px}header img{width:62px;height:52px;object-fit:contain;background:#fff;border-radius:12px;padding:3px}header h1{margin:0;font-size:19px}header p{margin:2px 0 0;font-size:12px;opacity:.92}
.bar{padding:10px 10px 6px;position:sticky;top:0;background:var(--bg);z-index:5}input{width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:24px;font-size:16px;background:#fff}
.cats{display:flex;gap:8px;overflow:auto;padding:4px 10px 10px;scrollbar-width:none}.cats button{white-space:nowrap;border:1px solid #e6d5ea;padding:8px 14px;border-radius:20px;background:#fff;font-size:14px;color:var(--p)}.cats button.on{background:var(--p);color:#fff;border-color:var(--p)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 10px 90px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 5px #0001;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#eee}.in{padding:8px;display:flex;flex-direction:column;gap:4px;flex:1}.in b{font-size:13px;line-height:1.4;min-height:36px}
.pr{color:var(--p);font-weight:bold;font-size:17px}.pr small{font-size:11px;color:#777;font-weight:normal}.dz{font-size:11px;background:#fbe8f1;color:#b02a62;border-radius:8px;padding:2px 6px;align-self:flex-start}
.q{display:flex;align-items:center;justify-content:space-between;margin-top:auto}.q button{width:34px;height:34px;border:0;border-radius:50%;background:var(--p);color:#fff;font-size:20px}.q button.m{background:#eee;color:#555}
#cart{position:fixed;bottom:0;left:0;right:0;padding:10px;background:#fff;box-shadow:0 -2px 8px #0002;z-index:9}#cart button{width:100%;padding:14px;border:0;border-radius:12px;background:#25d366;color:#fff;font-size:17px;font-weight:bold}
#m{position:fixed;inset:0;background:#000a;display:none;z-index:20;align-items:flex-end}#m.on{display:flex}#mb{background:#fff;width:100%;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px}#mb .ims{display:flex;gap:8px;overflow:auto}#mb .ims img{height:230px;border-radius:12px}#mb p{font-size:14px;line-height:1.7;color:#444}</style></head><body>
<header><img src="6-logo.png" alt=""><div><h1>أرابيا جروب</h1><p>مكياج ومستحضرات تجميل جملة من أول قطعة - شحن لجميع المحافظات</p></div></header>
<div class="bar"><input id="s" placeholder="ابحث عن منتج..."></div><div class="cats" id="cats"></div><div class="grid" id="g"></div>
<div id="cart"><button id="send">اطلب عبر واتساب (0)</button></div><div id="m" onclick="if(event.target==this)this.classList.remove('on')"><div id="mb"></div></div>
<script>
const PHONE="201112462010";let P=[],cart={},cat="الكل",q="";
fetch("7-products.json").then(r=>r.json()).then(d=>{P=d;r();if(location.hash.startsWith("#p"))o(+location.hash.slice(2))});
const cats=["الكل","مكياج","عناية بالجسم","عناية بالبشرة","عطور وسبلاش"];
function pr(p){return `<div class="pr">${p.p} ج <small>${p.l||"للقطعة"}</small></div>${p.d?`<span class="dz">الدستة ${p.d} ج</span>`:""}`}
function r(){cats_.innerHTML=cats.map(c=>`<button class="${c==cat?'on':''}" onclick="cat='${c}';r()">${c}</button>`).join("");
g.innerHTML=P.filter(p=>(cat=="الكل"||p.c==cat)&&p.n.includes(q)).map(p=>`<div class="card"><img loading="lazy" src="${p.i[0]}" onclick="o(${p.id})"><div class="in"><b onclick="o(${p.id})">${p.n}</b>${pr(p)}<div class="q"><button onclick="c(${p.id},1)">+</button><span>${cart[p.id]||0}</span><button class="m" onclick="c(${p.id},-1)">-</button></div></div></div>`).join("");
const n=Object.values(cart).reduce((a,b)=>a+b,0);send.textContent=`اطلب عبر واتساب (${n})`}
const cats_=document.getElementById("cats"),g=document.getElementById("g"),send=document.getElementById("send");
function c(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);r()}
function o(id){const p=P.find(x=>x.id==id);mb.innerHTML=`<div class="ims">${p.i.map(i=>`<img src="${i}">`).join("")}</div><h3>${p.n}</h3>${pr(p)}<p>${p.t}</p><div class="q"><button onclick="c(${id},1);o(${id})">+</button><b>${cart[id]||0}</b><button class="m" onclick="c(${id},-1);o(${id})">-</button></div>`;m.classList.add("on")}
const mb=document.getElementById("mb"),m=document.getElementById("m");
document.getElementById("s").oninput=e=>{q=e.target.value;r()};
send.onclick=()=>{const l=Object.entries(cart).filter(([,v])=>v).map(([i,v])=>{const p=P.find(x=>x.id==i);return `- ${p.n} × ${v} (${p.p} ج)`});if(!l.length)return alert("اختار منتجات الأول");location.href="https://wa.me/"+PHONE+"?text="+encodeURIComponent("طلب جملة من التطبيق:\n"+l.join("\n"))};
if("serviceWorker"in navigator)navigator.serviceWorker.register("3-sw.js")
</script></body></html>
